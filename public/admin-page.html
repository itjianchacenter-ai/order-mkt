<!doctype html>
<html lang="th">
<head>
<title>JIAN CHA Page</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="icon" href="data:,">
</head>
<body>
<div class="wrap">
  <header class="site-head" id="site-head"></header>
  <div id="app"></div>
</div>
<script src="/js/app.js"></script>
<script>
(async () => {
  const app = $('#app');
  // In the single-file preview the page is re-run on every hash change; stop stale async renders.
  const token = Symbol('page'); window.__pageToken = token; const alive = () => window.__pageToken === token;
  const params = new URLSearchParams(location.search);
  const state = { view: params.get('view') || '', campaign: params.get('campaign') || '', create: params.get('create') || '', store: params.get('store') || '', q: params.get('q') || '', date: '', status: params.get('status') || '', page: 1 };
  const go = (p) => { const qs = new URLSearchParams(Object.fromEntries(Object.entries(p).filter(([, v]) => v))); location.href = ADMIN_PATH + (qs.toString() ? '?' + qs : ''); };

  const me = await api('/api/admin/me');
  if (!alive()) return;
  if (!me.admin) { renderHeader('', { admin: true }); return renderLogin(); }
  const user = me.user, P = me.permissions;
  // customer URL of a campaign: order.jianchatea.com/<slug>/ (preview: this file + #/<slug>/)
  const siteUrl = (c) => (me.public_base_url || (location.origin + (window.PREVIEW_MODE ? (location.protocol === 'file:' ? window.location['pathname'] + '#' : PV_BASE.replace(/\/$/, '')) : ''))) + c.url;
  // '' = home (campaign page). Every role sees Order / Slip Issue / Store Pick-up Order; IT-Admin also Account.
  const VIEWS = { '': true, accounts: P.accounts, design: P.campaigns, orders: true, slips: true, pickup: true, customers: true };
  if (!VIEWS[state.view]) state.view = '';
  // Every role gets the hamburger menu on every back-office page (it also holds Logout).
  renderHeader(state.view, { admin: true, role: user.role, user });

  function renderLogin() {
    app.innerHTML = `<form class="login" id="login"><h3 style="margin:0">JIAN CHA Page login</h3><span class="th" style="font-size:13px">เข้าสู่ระบบหลังบ้าน (IT-Admin / Admin / Finance)</span>
      <label>Username</label><input name="username" autocomplete="username" required>
      <label>Password</label><input name="password" type="password" autocomplete="current-password" required>
      <button class="confirm" type="submit"><b>Login</b></button><div class="err" id="err"></div></form>`;
    $('#login').addEventListener('submit', async (e) => {
      e.preventDefault(); const f = new FormData(e.target);
      try { await api('/api/admin/login', { method: 'POST', body: { username: f.get('username'), password: f.get('password') } }); location.reload(); }
      catch (err) { $('#err').textContent = err.message; }
    });
  }

  /* ───────── home: campaign page ───────── */
  if (state.view === '') return renderCampaigns();
  async function renderCampaigns() {
    const campaigns = await api('/api/admin/campaigns');
    if (!alive()) return;
    app.innerHTML = `
      <div class="toolbar">
        <input class="search" id="q" placeholder="Campaign / Order No. …" style="width:300px">
        <span class="pill">${ICONS.target} Campaign Selection</span>
      </div>
      <div class="camp-grid" id="camps"></div>
      <div id="camp-form"></div>`;
    const draw = (filter = '') => {
      const f = filter.trim().toLowerCase();
      const cards = campaigns.filter((c) => !f || c.name.toLowerCase().includes(f) || c.id.includes(f)).map((c) => `
        <div class="camp ${c.active ? '' : 'inactive'}" data-open="${esc(c.id)}">
          ${P.campaigns ? `<button type="button" class="wrench" data-edit="${esc(c.id)}" aria-label="แก้ไข">${ICONS.wrench}</button>` : ''}
          ${c.cover ? `<img class="cover" src="${esc(c.cover)}" alt="">` : ''}
          <b>${esc(c.name)}</b>
          <small>${c.active ? 'Active' : 'Inactive'}${c.orders_open === false ? ' · ปิดรับออเดอร์' : ''} · ${c.stats.orders} orders${c.stock.total != null ? ` · stock ${c.stock_view.used.total}/${c.stock.total}` : ''}${c.set_count != null ? ` · ${c.set_count} sets` : ''}</small>
          <small class="camp-url"><a href="${esc(siteUrl(c))}" target="_blank" rel="noopener" data-stop="1">${esc(siteUrl(c).replace(/^https?:\/\//, ''))}</a></small>
          ${P.campaigns ? `<span class="camp-acts"><button type="button" class="btn ghost sm" data-design="${esc(c.id)}">${ICONS.brush} Design</button><button type="button" class="btn ghost sm" data-copy="${esc(siteUrl(c))}">Copy link</button></span>` : ''}
        </div>`);
      if (P.campaigns) cards.push(`<div class="camp create" data-create="1"><span class="plus">+</span><b>Create</b><span>new campaign</span></div>`);
      // an order number in the search box jumps straight to that order (all campaigns)
      if (/^\d{6,}$/.test(f)) cards.unshift(`<div class="camp" data-search="${esc(f)}"><b>${ICONS.doc} Search order ${esc(f)}</b><small>ค้นหาเลขคำสั่งซื้อในทุกแคมเปญ</small></div>`);
      $('#camps').innerHTML = cards.join('') || '<div class="empty">ไม่พบแคมเปญ</div>';
    };
    draw();
    if (state.create && P.campaigns) campaignForm(null);
    $('#q').addEventListener('input', (e) => draw(e.target.value));
    $('#camps').addEventListener('click', (e) => {
      if (e.target.closest('[data-stop]')) return;
      const edit = e.target.closest('[data-edit]'); if (edit) return campaignForm(campaigns.find((c) => c.id === edit.dataset.edit));
      const dz = e.target.closest('[data-design]'); if (dz) return go({ view: 'design', campaign: dz.dataset.design });
      const cp = e.target.closest('[data-copy]'); if (cp) { navigator.clipboard && navigator.clipboard.writeText(cp.dataset.copy); cp.textContent = 'Copied ✓'; setTimeout(() => { cp.textContent = 'Copy link'; }, 1500); return; }
      if (e.target.closest('[data-create]')) return campaignForm(null);
      const s = e.target.closest('[data-search]'); if (s) return go({ view: 'orders', q: s.dataset.search, all: 1 });
      const card = e.target.closest('[data-open]'); if (card) go({ view: 'orders', campaign: card.dataset.open });
    });
    function campaignForm(c) {
      const isNew = !c;
      $('#camp-form').innerHTML = `<form class="cform" id="cf">
        <h3 style="margin:0 0 4px">${isNew ? 'Create new campaign' : 'Edit campaign'}</h3><span class="th" style="font-size:13px">${isNew ? 'สร้างแคมเปญใหม่ (เริ่มเป็น Inactive จนกว่าจะเปิดใช้งาน)' : 'แก้ไขแคมเปญ ' + esc(c.name)}</span>
        <div class="grid2">
          <label>Campaign name<input name="name" required value="${esc(c ? c.name : '')}" placeholder="JIANCHA x NAVORI"></label>
          <label>Campaign link (URL) <span class="th" style="font-weight:400">a-z, 0-9 — ว่าง = ตั้งจากชื่อ</span><input name="slug" pattern="[a-z0-9]{2,40}" value="${esc(c ? c.slug : '')}" placeholder="jianchaxnavori"><span class="th" style="font-size:12px;color:var(--muted)">${esc((me.public_base_url || location.origin) + '/')}<b id="slug-preview">${esc(c ? c.slug : '…')}</b>/</span></label>
          <label>Stock (total pieces)<input name="stock_total" type="number" min="0" value="${c && c.stock.total != null ? c.stock.total : (isNew ? 1000 : '')}" placeholder="ว่าง = ไม่จำกัด"></label>
          <label>Promo code from<input name="promo_from" type="number" required value="${c ? c.promo_code.from : 2026090001}"></label>
          <label>Promo code to<input name="promo_to" type="number" required value="${c ? c.promo_code.to : 2026092000}"></label>
        </div>
        <label class="chk"><input type="checkbox" name="active" ${c && c.active ? 'checked' : ''}> <span>Active <span class="th">(แคมเปญหลักที่แสดงเมื่อเปิด ${esc((me.public_base_url || location.origin).replace(/^https?:\/\//, ''))}/ มีได้ครั้งละ 1 แคมเปญ ทุกแคมเปญยังเปิดได้จากลิงก์ของตัวเอง)</span></span></label>
        <label class="chk"><input type="checkbox" name="orders_open" ${!c || c.orders_open !== false ? 'checked' : ''}> <span>เปิดรับคำสั่งซื้อ <span class="th">(ปิด = ลูกค้ายังเปิดหน้าแคมเปญได้แต่สั่งซื้อไม่ได้)</span></span></label>
        <div class="actions"><button class="btn" type="submit">${isNew ? '+ Create' : 'Save'}</button><button class="btn ghost" type="button" id="cf-cancel">Cancel</button></div>
        <div class="err" id="cf-err"></div></form>`;
      $('#cf-cancel').addEventListener('click', () => { $('#camp-form').innerHTML = ''; });
      const slugFrom = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 40);
      const showSlug = () => { const f = $('#cf'); $('#slug-preview').textContent = slugFrom(f.slug.value) || slugFrom(f.name.value) || '…'; };
      $('#cf').name.addEventListener('input', showSlug); $('#cf').slug.addEventListener('input', showSlug);
      $('#cf').addEventListener('submit', async (e) => {
        e.preventDefault(); const f = new FormData(e.target);
        const body = { name: f.get('name'), slug: String(f.get('slug') || '').trim(), stock_total: f.get('stock_total'), promo_from: f.get('promo_from'), promo_to: f.get('promo_to'), active: f.get('active') === 'on', orders_open: f.get('orders_open') === 'on' };
        try { await api(isNew ? '/api/admin/campaigns' : '/api/admin/campaigns/' + encodeURIComponent(c.id), { method: isNew ? 'POST' : 'PATCH', body }); location.reload(); }
        catch (err) { $('#cf-err').textContent = err.message; }
      });
      $('#camp-form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  /* ───────── customers: ลูกค้าที่ล็อกอินด้วย Google (อีเมล ชื่อ ล็อกอินล่าสุด ออเดอร์ ยอดชำระ) ───────── */
  if (state.view === 'customers') return renderCustomers();
  async function renderCustomers() {
    // แยกตามแคมเปญ: ลูกค้าที่ล็อกอินจาก /<แคมเปญ>/ หรือสั่งซื้อในแคมเปญนั้น (ค่าเริ่มต้น = แคมเปญที่ Active; เลือก "ทุกแคมเปญ" ได้)
    const campaigns = await api('/api/admin/campaigns'); if (!alive()) return;
    const allC = state.campaign === 'all';
    const campaign = allC ? null : (campaigns.find((c) => c.id === state.campaign) || campaigns.find((c) => c.active) || campaigns[0]);
    const campParam = allC ? 'all' : (campaign ? campaign.id : '');
    const campSelect = `<select class="pill" id="campaign-select" style="padding-right:28px">${campaigns.map((c) => `<option value="${esc(c.id)}" ${campaign && c.id === campaign.id ? 'selected' : ''}>${esc(c.name)} · /${esc(c.slug)}/${c.active ? '' : ' (inactive)'}</option>`).join('')}<option value="all" ${allC ? 'selected' : ''}>ทุกแคมเปญ / All campaigns</option></select>`;
    app.innerHTML = `
      <div class="toolbar">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <input class="search" id="q" placeholder="Email / ชื่อ …" value="${esc(state.q)}">
          ${campSelect}
          <span class="pill" id="cust-count">${ICONS.users} Customer</span>
        </div>
        <button type="button" class="pill" id="cust-csv">${ICONS.doc} Download CSV</button>
      </div>
      <div class="tbl-wrap"><table class="jc-tbl" id="cust-tbl">
        <thead><tr><th>Customer</th><th>Email</th><th>Last login</th><th class="num">Orders</th><th class="num">Paid (฿)</th><th>Last order</th>${allC ? '' : '<th>Joined campaign</th>'}</tr></thead>
        <tbody></tbody></table></div>
      <div class="pager"><button type="button" id="prev">${ICONS.arrowL}</button><span class="pg" id="pg">1</span><button type="button" id="next">${ICONS.arrowR}</button></div>`;
    const row = (c) => `<tr>
        <td class="who">${c.picture ? `<img class="avatar" src="${esc(c.picture)}" alt="" referrerpolicy="no-referrer">` : ICONS.user} <b>${esc(c.name || '-')}</b></td>
        <td class="mono"><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></td>
        <td>${fmtDateTime(c.last_login_at)}</td>
        <td class="num">${c.orders}</td>
        <td class="num">${money(c.paid_total)}</td>
        <td>${c.last_order_at ? fmtDateTime(c.last_order_at) : '-'}</td>${allC ? '' : `<td>${c.joined_at ? fmtDateTime(c.joined_at) : '-'}</td>`}</tr>`;
    async function load() {
      let data; try { data = await api('/api/admin/customers?' + new URLSearchParams({ campaign: campParam, q: state.q, page: state.page })); } catch (e) { if (/401/.test(e.message)) return location.reload(); $('#cust-tbl tbody').innerHTML = `<tr><td colspan="6" class="err">${esc(e.message)}</td></tr>`; return; }
      if (!alive()) return;
      state.page = data.page;
      $('#cust-tbl tbody').innerHTML = data.rows.map(row).join('') || `<tr><td colspan="7" class="empty">ยังไม่มีลูกค้าที่ล็อกอิน${campaign ? 'ในแคมเปญ ' + esc(campaign.name) : ''} / No customers yet</td></tr>`;
      $('#cust-count').innerHTML = `${ICONS.users} Customer <b>${data.total}</b>${campaign ? ` <span class="th">· ${esc(campaign.name)}</span>` : ' <span class="th">· ทุกแคมเปญ</span>'}`;
      $('#pg').textContent = `${data.page} / ${data.pages}`; $('#prev').disabled = data.page <= 1; $('#next').disabled = data.page >= data.pages;
    }
    $('#campaign-select').addEventListener('change', (e) => go({ view: 'customers', campaign: e.target.value, q: state.q }));
    let t; $('#q').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); state.page = 1; load(); }, 250); });
    $('#prev').addEventListener('click', () => { state.page--; load(); });
    $('#next').addEventListener('click', () => { state.page++; load(); });
    // CSV: ดึงทั้งหมด (ตามคำค้น) แล้วสร้างไฟล์ฝั่งเบราว์เซอร์ ใช้ได้ทั้ง server จริงและ preview
    $('#cust-csv').addEventListener('click', async () => {
      const data = await api('/api/admin/customers?' + new URLSearchParams({ campaign: campParam, q: state.q, export: '1' }));
      const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lines = [['campaign', 'name', 'email', 'last_login', 'orders', 'paid_total', 'last_order', 'joined_campaign', 'first_seen'].join(','), ...data.rows.map((c) => [campaign ? campaign.name : 'all', c.name, c.email, c.last_login_at, c.orders, c.paid_total, c.last_order_at || '', c.joined_at || '', c.created_at].map(cell).join(','))];
      const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `customers-${campaign ? campaign.slug : 'all'}-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
    load();
  }

  /* ───────── accounts (IT-Admin) ───────── */
  if (state.view === 'accounts') return renderAccounts();
  async function renderAccounts() {
    const ROLE_LABEL = { it_admin: 'IT - Admin', admin: 'Admin', finance: 'Finance' };
    let users = await api('/api/admin/users');
    if (!alive()) return;
    app.innerHTML = `
      <div class="toolbar"><input class="search" id="q" placeholder="Search …"><button type="button" class="btn" id="new" style="padding:10px 20px;font-size:17px">+ New</button></div>
      <div id="acc-form"></div>
      <div class="camp-grid" id="users"></div>`;
    const draw = (filter = '') => {
      const f = filter.trim().toLowerCase();
      $('#users').innerHTML = users.filter((u) => !f || [u.username, u.display_name, u.department, u.role].join(' ').toLowerCase().includes(f)).map((u) => `
        <div class="acc ${u.active ? '' : 'inactive'}">
          ${u.id !== user.id ? `<button type="button" class="wrench" data-edit="${esc(u.id)}" aria-label="แก้ไข">${ICONS.wrench}</button>` : ''}
          <b>${esc(u.display_name || ROLE_LABEL[u.role])}</b>
          <div><span class="k">username:</span> ${esc(u.username)}</div>
          <div><span class="k">password:</span> ••••••••</div>
          <div style="margin-top:8px"><span class="k">department:</span> ${esc(u.department || '-')}</div>
          <small>${ROLE_LABEL[u.role]}${u.active ? '' : ' · <span class="th">ปิดใช้งาน</span>'}${u.id === user.id ? ' · you' : ''}</small>
        </div>`).join('') || '<div class="empty">ไม่พบผู้ใช้</div>';
    };
    draw();
    $('#q').addEventListener('input', (e) => draw(e.target.value));
    $('#new').addEventListener('click', () => accountForm(null));
    $('#users').addEventListener('click', (e) => { const b = e.target.closest('[data-edit]'); if (b) accountForm(users.find((u) => u.id === b.dataset.edit)); });
    function accountForm(u) {
      const isNew = !u;
      $('#acc-form').innerHTML = `<form class="cform" id="af">
        <h3 style="margin:0 0 4px">${isNew ? 'New account' : 'Edit account: ' + esc(u.username)}</h3>
        <div class="grid2">
          <label>Username<input name="username" ${isNew ? 'required' : 'disabled'} value="${esc(u ? u.username : '')}" pattern="[A-Za-z0-9._\\-]{2,40}"></label>
          <label>${isNew ? 'Password' : 'New password (leave blank to keep)'}<input name="password" type="password" ${isNew ? 'required' : ''} minlength="6" autocomplete="new-password"></label>
          <label>Display name<input name="display_name" value="${esc(u ? u.display_name : '')}" placeholder="Finance"></label>
          <label>Department<input name="department" value="${esc(u ? u.department : '')}" placeholder="Finance"></label>
          <label>Role<select name="role">${Object.entries(ROLE_LABEL).map(([k, v]) => `<option value="${k}" ${u && u.role === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          ${isNew ? '' : `<label class="chk" style="align-self:end"><input type="checkbox" name="active" ${u.active ? 'checked' : ''}> <span>Active</span></label>`}
        </div>
        <p class="th" style="font-size:13px;margin:8px 0 0;color:var(--muted)">IT-Admin: ทำได้ทุกอย่าง · Admin (Marketing): ดูออเดอร์ สลิป และรับสินค้า · Finance: เพิ่ม Approve / Reject สลิป และยกเลิกออเดอร์</p>
        <div class="actions"><button class="btn" type="submit">${isNew ? '+ Create' : 'Save'}</button><button class="btn ghost" type="button" id="af-cancel">Cancel</button>${isNew ? '' : '<button class="btn ghost" type="button" id="af-delete" style="margin-left:auto">Delete</button>'}</div>
        <div class="err" id="af-err"></div></form>`;
      $('#af-cancel').addEventListener('click', () => { $('#acc-form').innerHTML = ''; });
      if (!isNew) $('#af-delete').addEventListener('click', async () => {
        if (!confirm(`ลบบัญชี ${u.username}?`)) return;
        try { await api('/api/admin/users/' + u.id, { method: 'DELETE' }); users = await api('/api/admin/users'); $('#acc-form').innerHTML = ''; draw($('#q').value); } catch (err) { $('#af-err').textContent = err.message; }
      });
      $('#af').addEventListener('submit', async (e) => {
        e.preventDefault(); const f = new FormData(e.target);
        const body = { display_name: f.get('display_name'), department: f.get('department'), role: f.get('role') };
        if (f.get('password')) body.password = f.get('password');
        if (isNew) body.username = f.get('username'); else body.active = f.get('active') === 'on';
        try { await api(isNew ? '/api/admin/users' : '/api/admin/users/' + u.id, { method: isNew ? 'POST' : 'PATCH', body }); users = await api('/api/admin/users'); $('#acc-form').innerHTML = ''; draw($('#q').value); }
        catch (err) { $('#af-err').textContent = err.message; }
      });
      $('#acc-form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  /* ───────── design (IT-Admin): promote images + Match Sets shown on the customer homepage ───────── */
  if (state.view === 'design') return renderDesign();
  async function renderDesign() {
    const campaigns = await api('/api/admin/campaigns');
    if (!alive()) return;
    const campaign = campaigns.find((c) => c.id === state.campaign);
    if (!campaign) { // landing: pick the campaign whose pictures you want to edit
      app.innerHTML = `
        <div class="toolbar"><span class="pill on" style="font-size:20px;font-weight:800;padding:10px 20px">All Campaign</span></div>
        <div class="dz-camps">${campaigns.map((c) => `<div class="dz-camp" data-design="${esc(c.id)}">${c.cover ? `<img src="${esc(c.cover)}" alt="">` : ''}<b>${esc(c.name)}</b><small>${esc(siteUrl(c).replace(/^https?:\/\//, ''))}</small></div>`).join('')}
          <div class="dz-camp create" data-create="1"><span class="plus">+</span><span><b>Create</b><br>new campaign</span></div>
        </div>`;
      app.addEventListener('click', (e) => {
        const dz = e.target.closest('[data-design]'); if (dz) return go({ view: 'design', campaign: dz.dataset.design });
        if (e.target.closest('[data-create]')) go({ view: '', create: 1 });
      });
      return;
    }
    let { design } = await api('/api/admin/campaigns/' + encodeURIComponent(campaign.id) + '/design');
    if (!alive()) return;
    app.innerHTML = `
      <div class="dz-head"><span class="dz-name">${esc(campaign.name)}</span><a class="pill" href="${esc(siteUrl(campaign))}" target="_blank" rel="noopener">${ICONS.eye} ${esc(siteUrl(campaign).replace(/^https?:\/\//, ''))}</a><span class="dz-state" id="dz-state">${campaign.active ? 'แคมเปญหลัก · แสดงที่หน้าแรกด้วย' : 'เปิดได้จากลิงก์ของแคมเปญ'}</span><a class="pill on dz-another" href="${ADMIN_PATH}?view=design">Another Campaign</a></div>
      <div class="dz-title"><span>Promote Image</span><span class="dz-size">1180 × 570 px · svg / png · รูปใหญ่รวมน้ำ + ขนม (หลายรูป = สไลด์)</span></div>
      <div class="dz-row promo" id="promos"></div>
      <div id="sets"></div>
      <input type="file" id="dz-file" accept="image/*" class="hidden">
      <div class="err" id="dz-err"></div>
      <div class="dz-savebar" id="dz-savebar"><span class="th" id="dz-dirty">ยังไม่มีการแก้ไข</span><button type="button" class="btn ghost" id="dz-discard" disabled>ยกเลิกการแก้ไข</button><button type="button" class="btn" id="dz-save" disabled>${ICONS.check} Save <span class="th">/ บันทึก</span></button></div>`;
    const img = (src, cls) => (src ? `<img src="${esc(src)}" alt="">` : '');
    const upBtn = (key) => `<button type="button" class="up" data-up="${key}">${ICONS.upload} Upload</button>`;
    $('#dz-file').setAttribute('accept', 'image/png,image/jpeg,image/webp,image/svg+xml,image/gif');
    const nextId = () => { for (let i = 0; i < 26; i++) { const id = String.fromCharCode(65 + i); if (!design.sets.some((x) => x.id === id)) return id; } return 'S' + (design.sets.length + 1); };
    function draw() {
      $('#promos').innerHTML = design.promote_images.map((u, i) => `<div class="dz-card wide">${img(u)}<button type="button" class="rm" data-rm-promo="${i}" aria-label="ลบ">×</button>${upBtn('promo:' + i)}</div>`).join('')
        + `<div class="dz-card wide create" data-add-promo="1"><span class="plus">+</span><b>Create</b><span>more Promote Image</span></div>`;
      $('#sets').innerHTML = `<div class="dz-sets">` + design.sets.map((st, i) => `
        <div class="dz-set" data-set="${i}">
          <div class="dz-title"><span>Set image</span><span class="set-tag">${esc(st.id)}</span></div>
          <div class="dz-card big">${img(st.image)}${upBtn('set:' + i + ':image')}</div>
          <div class="dz-thumbs">${[0, 1, 2].map((k) => `<div class="dz-card sm">${img(st.images[k])}${upBtn('set:' + i + ':images:' + k)}</div>`).join('')}</div>
          <div class="dz-size" style="margin-top:8px">รูปเซ็ต 320 × 330 px · รูปน้ำ / ขนมเดี่ยว 115 × 105 px · svg / png</div>
          <div class="dz-form">
            <div class="g2">
              <label>Label<input data-f="label" value="${esc(st.label)}" placeholder="SET ${esc(st.id)}"></label>
              <label>Price (฿)<input data-f="price" type="number" min="0" step="0.01" value="${st.price}"></label>
              <label>Menu name (EN)<input data-f="name_en" value="${esc(st.name_en)}" placeholder="Menu Name"></label>
              <label>ชื่อเมนู (TH)<input data-f="name_th" value="${esc(st.name_th)}" placeholder="ชื่อเมนู ภาษาไทย"></label>
              <label>Stock ต่อ 1 ชุด (pieces)<input data-f="pieces" type="number" min="1" step="1" value="${st.pieces}"></label>
              <label class="chk" style="margin-top:20px"><input type="checkbox" data-f="active" ${st.active ? 'checked' : ''}> <span>แสดงบนหน้าเว็บ</span></label>
            </div>
            <div class="items-h"><span>รายการในเซ็ต (items)</span><button type="button" data-add-item="${i}">+ เพิ่มรายการ</button></div>
            ${st.items.map((it, k) => `<div class="g3" data-item="${k}">
              <label>EN<input data-if="name_en" value="${esc(it.name_en)}" placeholder="Menu name"></label>
              <label>TH<input data-if="name_th" value="${esc(it.name_th)}" placeholder="ชื่อเมนู"></label>
              <label>ประเภท<select data-if="kind"><option value="" ${it.kind ? '' : 'selected'}>-</option><option value="drink" ${it.kind === 'drink' ? 'selected' : ''}>drink</option><option value="dessert" ${it.kind === 'dessert' ? 'selected' : ''}>dessert</option></select></label>
            </div>`).join('') || '<div class="th" style="font-size:12px;color:var(--muted)">ยังไม่มีรายการ</div>'}
            <button type="button" class="del" data-del-set="${i}">ลบเซ็ตนี้</button>
          </div>
        </div>`).join('')
        + `<div class="dz-set dz-set-new"><div class="dz-title"><span>Set image</span></div><div class="dz-card create dz-create" data-add-set="1"><span class="plus">+</span><b>Create</b><span>new set</span></div></div></div>`;
    }
    // changes stay local until Save is pressed (uploads land on the server right away, but the page only uses them once saved)
    let saving = false, dirty = false;
    const setState = (t) => { const el = $('#dz-state'); if (el) el.textContent = t; };
    const setDirty = (v) => {
      dirty = v; const bar = $('#dz-savebar'); if (!bar) return;
      bar.classList.toggle('dirty', v); $('#dz-save').disabled = !v || saving; $('#dz-discard').disabled = !v || saving;
      $('#dz-dirty').textContent = v ? 'มีการแก้ไขที่ยังไม่บันทึก กด Save เพื่อยืนยัน' : 'ยังไม่มีการแก้ไข';
    };
    async function save() {
      if (saving || !dirty) return;
      saving = true; setState('กำลังบันทึก…'); $('#dz-save').disabled = true; $('#dz-discard').disabled = true;
      try { const r = await api('/api/admin/campaigns/' + encodeURIComponent(campaign.id) + '/design', { method: 'PUT', body: design }); design = r.design; $('#dz-err').textContent = ''; setState('บันทึกแล้ว ✓ แสดงที่ ' + siteUrl(campaign).replace(/^https?:\/\//, '')); saving = false; setDirty(false); draw(); }
      catch (e) { $('#dz-err').textContent = e.message; setState('บันทึกไม่สำเร็จ'); saving = false; setDirty(true); }
    }
    const queueSave = () => { setState('แก้ไขแล้ว ยังไม่บันทึก'); setDirty(true); };
    $('#dz-save').addEventListener('click', save);
    $('#dz-discard').addEventListener('click', () => { if (confirm('ยกเลิกการแก้ไขทั้งหมดที่ยังไม่ได้บันทึก?')) location.reload(); });
    const guard = (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', guard);
    app.addEventListener('click', (e) => { const a = e.target.closest('a.dz-another'); if (a && dirty && !confirm('มีการแก้ไขที่ยังไม่บันทึก ออกจากหน้านี้โดยไม่บันทึก?')) e.preventDefault(); });
    // read a set's form fields back into the design
    function readSet(i, root) {
      const st = design.sets[i]; if (!st) return;
      $$('[data-f]', root).forEach((el) => { const f = el.dataset.f; st[f] = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? Number(el.value) : el.value); });
      st.items = $$('[data-item]', root).map((row) => ({ name_en: $('[data-if=name_en]', row).value, name_th: $('[data-if=name_th]', row).value, kind: $('[data-if=kind]', row).value }));
    }
    app.addEventListener('input', (e) => { const set = e.target.closest('[data-set]'); if (!set) return; readSet(Number(set.dataset.set), set); queueSave(); });
    app.addEventListener('change', (e) => { const set = e.target.closest('[data-set]'); if (set && (e.target.type === 'checkbox' || e.target.tagName === 'SELECT')) { readSet(Number(set.dataset.set), set); queueSave(); } });
    let upTarget = null;
    app.addEventListener('click', (e) => {
      const up = e.target.closest('[data-up]'); if (up) { upTarget = up.dataset.up; $('#dz-file').value = ''; $('#dz-file').click(); return; }
      if (e.target.closest('[data-add-promo]')) { upTarget = 'promo:new'; $('#dz-file').value = ''; $('#dz-file').click(); return; }
      const rmP = e.target.closest('[data-rm-promo]'); if (rmP) { design.promote_images.splice(Number(rmP.dataset.rmPromo), 1); draw(); queueSave(); return; }
      if (e.target.closest('[data-add-set]')) { const id = nextId(); design.sets.push({ id, label: 'SET ' + id, name_en: '', name_th: '', price: 0, image: '', images: ['', '', ''], items: [], pieces: 1, active: true }); draw(); queueSave(); return; }
      const del = e.target.closest('[data-del-set]'); if (del) { const st = design.sets[Number(del.dataset.delSet)]; if (!confirm(`ลบ ${st.label}? ออเดอร์เดิมไม่ได้รับผลกระทบ`)) return; design.sets.splice(Number(del.dataset.delSet), 1); draw(); queueSave(); return; }
      const addI = e.target.closest('[data-add-item]'); if (addI) { const i = Number(addI.dataset.addItem); readSet(i, $(`[data-set="${i}"]`)); design.sets[i].items.push({ name_en: '', name_th: '', kind: '' }); draw(); queueSave(); }
    });
    $('#dz-file').addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0]; if (!f || !upTarget) return;
      const key = upTarget; upTarget = null; setState('กำลังอัปโหลดรูป…');
      try {
        // recommended sizes: promote 1180×570 · set 320×330 · item 115×105 (kept at 2× for sharp screens; svg is left untouched)
        const [kind0, , field0] = key.split(':'); const box = kind0 === 'promo' ? [1180, 570] : (field0 === 'image' ? [320, 330] : [115, 105]);
        const mul = window.PREVIEW_MODE ? 1 : 2;
        const small = await shrinkImage(f, box[0] * mul, box[1] * mul);
        const fd = new FormData(); fd.append('image', small, small.name || 'image.jpg');
        const { url } = await api('/api/admin/design/upload', { method: 'POST', body: fd });
        const [kind, i, field, k] = key.split(':');
        if (kind === 'promo') { if (i === 'new') design.promote_images.push(url); else design.promote_images[Number(i)] = url; }
        else if (field === 'image') design.sets[Number(i)].image = url; else design.sets[Number(i)].images[Number(k)] = url;
        draw(); queueSave();
      } catch (err) { $('#dz-err').textContent = err.message; setState('อัปโหลดไม่สำเร็จ'); }
    });
    draw();
  }
  // downscale a picture in the browser before uploading (keeps uploads small; JPEG unless the source is PNG)
  async function shrinkImage(file, maxW, maxH) {
    if (file.type === 'image/svg+xml' || file.type === 'image/gif') return file;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, maxW / bmp.width, maxH / bmp.height);
      if (scale === 1 && file.size < 600 * 1024) return file;
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      const blob = await new Promise((res) => c.toBlob(res, type, 0.86));
      return new File([blob], (file.name || 'image').replace(/\.[^.]+$/, '') + (type === 'image/png' ? '.png' : '.jpg'), { type });
    } catch (e) { return file; }
  }

  /* ───────── shared context for Order · Slip Issue · Store Pick-up Order ───────── */
  const [stores, campaigns] = await Promise.all([api('/api/stores'), api('/api/admin/campaigns')]);
  if (!alive()) return;
  const campaign = campaigns.find((c) => c.id === state.campaign) || campaigns.find((c) => c.active) || campaigns[0];
  const isSlips = state.view === 'slips', isPickup = state.view === 'pickup';
  const campaignSelect = () => campaigns.length > 1
    ? `<select class="pill" id="campaign-select" style="padding-right:28px">${campaigns.map((c) => `<option value="${esc(c.id)}" ${campaign && c.id === campaign.id ? 'selected' : ''}>${esc(c.name)}${c.active ? '' : ' (inactive)'}</option>`).join('')}</select>`
    : `<span class="note-pill">${ICONS.target} <b>${esc(campaign ? campaign.name : '')}</b></span>`;
  const bindCampaignSelect = () => { const s = $('#campaign-select'); if (s) s.addEventListener('change', (e) => go({ view: state.view, campaign: e.target.value, store: isPickup ? state.store : '' })); };

  /* ───────── order lists ───────── */
  if (isPickup && state.store === 'all') state.store = '';
  if (isPickup && !state.status) state.status = 'paid,picked_up'; // orders that reached the store: waiting for pick-up and already picked up
  if (isSlips && !state.status) state.status = 'slip_uploaded,slip_rejected'; // Slip Issue opens on every slip that needs attention
  const FIN_LABEL = { pending: 'Unpaid', slip_uploaded: 'Verifying', paid: 'Approved', slip_rejected: 'On Issue', picked_up: 'Picked up', cancelled: 'Cancelled' };
  const STATUS_OPTIONS = isSlips
    ? [['slip_uploaded,slip_rejected', 'Slip issues · ทั้งหมดที่มีปัญหา'], ['slip_uploaded', 'Paid · รอตรวจ'], ['slip_rejected', 'On Issue'], ['pending', 'Unpaid'], ['paid', 'Approved'], ['picked_up', 'Picked up'], ['cancelled', 'Cancelled'], ['', 'All status']]
    : isPickup ? [['paid', 'รอรับสินค้า'], ['picked_up', 'รับแล้ว'], ['paid,picked_up', 'ทั้งหมด']]
    : [['', 'All status'], ['pending', 'รอชำระเงิน'], ['slip_uploaded', 'รอตรวจสลิป'], ['slip_rejected', 'สลิปไม่ผ่าน'], ['paid', 'ชำระแล้ว'], ['picked_up', 'รับสินค้าแล้ว'], ['cancelled', 'ยกเลิก']];
  const slipSummary = () => (isSlips && campaign ? `<span class="note-pill"><b>Slip issues ${campaign.stats.slip_issues}</b> <span class="th">(รอตรวจ ${campaign.stats.awaiting_review} · On Issue ${campaign.stats.on_issue})</span></span>` : '');

  // Toolbars follow the mock-ups: Order = search + date · Slip Issue = full filters · Store Pick-up Order = branch chips only
  const datePill = `<label class="pill datepill">${ICONS.cal} <span id="date-label">Date Selection</span><input type="date" id="date"></label>`;
  const toolbar = isPickup ? '' : isSlips ? `
    <div class="toolbar">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input class="search" id="q" placeholder="Order No. / Location" value="${esc(state.q)}">
        ${campaignSelect()}
        ${slipSummary()}
        <span id="stock-pill"></span>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <select class="pill" id="status" style="padding-right:28px">${STATUS_OPTIONS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
        ${datePill}
      </div>
    </div>` : `
    <div class="toolbar">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input class="search" id="q" placeholder="Order No. / Location" value="${esc(state.q)}">${campaigns.length > 1 ? campaignSelect() : ''}</div>
      ${datePill}
    </div>`;
  app.innerHTML = `
    ${toolbar}
    ${isPickup ? '<div class="chips" id="store-chips" style="margin-bottom:20px"></div>' : ''}
    <div id="list"></div>
    <div class="pager"><button type="button" id="prev">${ICONS.arrowL}</button><span class="pg" id="pg">1</span><button type="button" id="next">${ICONS.arrowR}</button></div>`;
  bindCampaignSelect();
  if ($('#status')) $('#status').value = state.status;
  if (isPickup) {
    $('#store-chips').innerHTML = `<button type="button" class="pill ${state.store ? '' : 'on'}" data-store="">All Stores</button>` + storeChips(stores, state.store);
    $('#store-chips').addEventListener('click', (e) => { const b = e.target.closest('[data-store]'); if (!b) return; state.store = b.dataset.store; state.page = 1; $$('#store-chips .pill').forEach((p) => p.classList.toggle('on', p === b)); load(); });
  }
  let t; if ($('#q')) $('#q').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); state.page = 1; load(); }, 250); });
  if ($('#date')) $('#date').addEventListener('change', (e) => { state.date = e.target.value; $('#date-label').textContent = state.date ? fmtDateTime(state.date + 'T00:00').slice(0, 10) : 'Date Selection'; state.page = 1; load(); });
  if ($('#status')) $('#status').addEventListener('change', (e) => { state.status = e.target.value; state.page = 1; load(); });
  $('#prev').addEventListener('click', () => { state.page--; load(); });
  $('#next').addEventListener('click', () => { state.page++; load(); });

  const list = $('#list'); bindOrderToggles(list);
  bindCodeActions(list, (updated) => load(updated.id));
  list.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-action]'); if (!b) return;
    const id = b.closest('.order').dataset.id; const to = b.dataset.action; const body = { status: to };
    if (to === 'cancelled' && !confirm('ยกเลิกคำสั่งซื้อนี้? สต๊อกจะถูกคืน')) return;
    if (to === 'slip_rejected') { const r = prompt('เหตุผลที่ไม่อนุมัติ (ลูกค้าจะเห็นข้อความนี้)', 'ยอดโอนไม่ตรง กรุณาอัปโหลดสลิปใหม่'); if (r == null) return; body.reason = r; }
    b.disabled = true;
    try { await api('/api/admin/orders/' + id + '/status', { method: 'POST', body }); load(id); }
    catch (err) { alert(err.message); b.disabled = false; }
  });

  function actionsFor(o) {
    const btn = (to, label, ghost) => `<button type="button" class="btn ${ghost ? 'ghost' : ''}" data-action="${to}">${label}</button>`;
    const acts = [];
    acts.push(`<a class="btn ghost" href="/receipt?order=${esc(o.id)}" target="_blank" rel="noopener">${ICONS.eye} View PO</a>`);
    if (canPrint(o)) acts.push(`<a class="btn ghost" href="/receipt?order=${esc(o.id)}&print=1" target="_blank" rel="noopener" aria-label="Print">${ICONS.print}</a>`);
    if (P.slip_review && o.status === 'slip_uploaded') { acts.push(btn('paid', ICONS.check + ' Approve')); acts.push(btn('slip_rejected', 'Reject')); }
    if (P.slip_review && (o.status === 'pending' || o.status === 'slip_rejected') && o.has_slip) acts.push(btn('paid', ICONS.check + ' Approve'));
    if (P.pickup && o.status === 'paid') acts.push(btn('picked_up', ICONS.store + ' รับสินค้าแล้ว'));
    if (P.cancel && ['pending', 'slip_uploaded', 'slip_rejected', 'paid'].includes(o.status)) acts.push(btn('cancelled', 'ยกเลิก', true));
    if (P.code && codeBox(o)) acts.push(codeBox(o));
    const slip = o.slip_url ? `<div style="margin-top:14px"><b style="font-size:13px">สลิป</b> <span style="font-size:12px;color:var(--muted)">${o.slip_verified ? 'ตรวจอัตโนมัติผ่าน' : 'ตรวจด้วยเจ้าหน้าที่'}${o.slip_ref ? ' · ref ' + esc(o.slip_ref) : ''}${o.slip_amount != null ? ' · ' + money(o.slip_amount) + ' ฿' : ''}${o.slip_reason ? ' · ' + esc(o.slip_reason) : ''}</span><br><a href="${esc(o.slip_url)}" target="_blank" rel="noopener"><img class="slip-thumb" src="${esc(o.slip_url)}" alt="slip"></a></div>` : '';
    return slip + '<div class="actions">' + acts.join('') + '</div>';
  }
  function headExtras(o) {
    if (!isSlips) return {};
    return {
      badge: `<span class="fin-pill st-${esc(o.status)}">${FIN_LABEL[o.status] || o.status}</span>`,
      aside: o.slip_url ? `<a class="slip-mini" href="${esc(o.slip_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><img src="${esc(o.slip_url)}" alt="slip"></a>` : '<span class="slip-mini empty-slip" title="ยังไม่มีสลิป"></span>',
    };
  }
  async function loadStock() {
    if (!$('#stock-pill')) return;
    try {
      const st = await api('/api/admin/summary?campaign=' + encodeURIComponent(campaign ? campaign.id : '')); const s = st.stock; const fmt = (n) => (n == null ? '∞' : n.toLocaleString('en-US'));
      const el = $('#stock-pill'); if (!el || !alive()) return;
      el.innerHTML = `<span class="note-pill ${s.sold_out ? 'sold' : ''}">Stock <b>${fmt(s.used.total)}</b> / ${fmt(s.limits.total)} · เหลือ <b>${fmt(s.remaining.total)}</b></span>`;
    } catch (e) { /* ignore */ }
  }
  async function load(openId) {
    loadStock();
    const qs = new URLSearchParams({ q: state.q, date: state.date, store: state.store, status: state.status, campaign: params.get('all') ? '' : (campaign ? campaign.id : ''), page: state.page });
    let data; try { data = await api('/api/admin/orders?' + qs); } catch (e) { if (/401/.test(e.message)) return location.reload(); if (alive()) list.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; return; }
    if (!alive()) return; // navigated away while loading
    state.page = data.page;
    list.innerHTML = data.rows.map((o) => orderCard(o, { light: true, open: o.id === openId, extra: actionsFor(o), ...headExtras(o) })).join('') || '<div class="empty">ไม่พบคำสั่งซื้อ</div>';
    // หน้าละ 20 รายการ (PAGE_SIZE ใน server.js) แสดง "หน้า / ทั้งหมด" ให้รู้ว่ามีหน้าถัดไป
    $('#pg').textContent = `${data.page} / ${data.pages}`; $('#prev').disabled = data.page <= 1; $('#next').disabled = data.page >= data.pages;
  }
  load();
})();
</script>
</body>
</html>
