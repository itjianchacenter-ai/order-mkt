<!doctype html>
<html lang="th">
<head>
<title>Order History | JIANCHA x NAVORI</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <header class="site-head" id="site-head"></header>
  <div id="list"></div>
</div>
<script src="/js/app.js"></script>
<script>
(async () => {
  renderHeader('orders');
  const list = $('#list'); bindOrderToggles(list);
  bindCodeActions(list, (updated) => {
    const card = list.querySelector(`.order[data-id="${CSS.escape(updated.id)}"]`);
    if (card) card.outerHTML = orderCard(updated, { open: true, extra: extraFor(updated) });
  });
  await loadMe();
  if (needLogin()) {
    list.innerHTML = `<div class="empty">เข้าสู่ระบบด้วย Google เพื่อดูประวัติการสั่งซื้อ / Sign in with Google to see your orders<br><button type="button" class="btn" id="orders-signin" style="margin-top:12px">${ICONS.google} Sign in with Google</button></div>`;
    $('#orders-signin').addEventListener('click', () => openLoginModal(() => location.reload()));
    return;
  }
  const orders = await api('/api/orders');
  if (!orders.length) { list.innerHTML = `<div class="empty">ยังไม่มีประวัติการสั่งซื้อ / No orders yet. <a href="${H()}/">Order now</a></div>`; return; }
  list.innerHTML = orders.map((o) => orderCard(o, { extra: extraFor(o) })).join('');
  function extraFor(o) {
    // Print appears only after Finance approves (status paid / picked_up)
    const printBtn = canPrint(o) ? `<a class="btn ghost" href="${H()}/receipt?order=${esc(o.id)}">${ICONS.print} Print <span class="th">/ พิมพ์ใบรายการ</span></a>` : '';
    let extra = `<div class="actions">${codeBox(o)}${printBtn}</div>`;
    if (o.status === 'pending' || o.status === 'slip_rejected') extra = `<div class="actions"><a class="btn" href="${H()}/pay?order=${esc(o.id)}">${o.has_slip || o.status === 'slip_rejected' ? 'อัปโหลดสลิปใหม่ / Re-upload slip' : 'ชำระเงิน / Pay now'}</a>${printBtn}</div>`;
    if (o.status === 'slip_uploaded') extra = `<div class="actions"><span class="th" style="font-size:13px">ได้รับสลิปแล้ว เจ้าหน้าที่กำลังตรวจสอบ</span>${printBtn}</div>`;
    return extra;
  }
})();
</script>
</body>
</html>
