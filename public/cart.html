<!doctype html>
<html lang="th">
<head>
<title>Cart | JIANCHA x NAVORI</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <header class="site-head" id="site-head"></header>

  <section>
    <div class="row-between"><div class="label" id="lbl-match"></div><span id="stock-pill" style="margin-bottom:14px"></span></div>
    <div class="err" id="stock-err"></div>
    <div class="matches" id="matches"></div>
  </section>

  <section class="section">
    <div class="label" id="lbl-cart"></div>
    <div class="summary">
      <div>
        <div class="panel" style="padding:8px 0"><ul class="cart-table" id="lines"></ul></div>
        <div id="contact-box"></div>
      </div>
      <div>
        <div class="sumbox bordered">
          <h3>Order Summary</h3><span class="sub th">สรุปราคารวม</span>
          <hr>
          <div class="tot"><span class="th">ยอดรวมราคาสินค้า</span><b id="total">0.00 ฿</b></div>
          <hr>
          <div class="store" id="store-name" style="font-size:15px">-</div>
        </div>
        <button type="button" class="confirm" id="confirm"><b>Confirm</b><small class="th">ยืนยันคำสั่งซื้อ</small></button>
        <div class="err" id="err"></div>
      </div>
    </div>
  </section>
</div>
<script src="/js/app.js"></script>
<script>
(async () => {
  renderHeader('cart');
  $('#lbl-match').innerHTML = ICONS.match + ' Match Sets';
  $('#lbl-cart').innerHTML = ICONS.cart + ' Cart Summary';
  const [menu, stores] = await Promise.all([getMenu(), api('/api/stores')]);
  const map = menuMap(menu);
  if (menu.campaign && menu.campaign.name) { const b = $('.brand b'); if (b) b.textContent = menu.campaign.name; }
  let stock = menu.stock; const getStock = () => stock;
  async function refreshStock() { try { stock = await api(withCampaign('/api/stock')); } catch (e) { /* keep last */ } render(); }
  const closed = menu.campaign && menu.campaign.orders_open === false;
  if (closed) $('#stock-err').textContent = 'แคมเปญนี้ปิดรับคำสั่งซื้อแล้ว / This campaign is closed';
  $('#contact-box').innerHTML = contactBox(); bindContactBox();
  bindMatchControls($('#matches'), render, { getStock, errEl: $('#stock-err'), map });
  function render() {
    const cart = loadCart(); const storeId = getStore(); const store = stores.find((s) => s.id === storeId);
    $('#stock-pill').innerHTML = stockPill(stock);
    $('#confirm').disabled = Boolean(stock && stock.sold_out) || closed;
    $('#matches').innerHTML = cart.map((l) => matchCard(l, map)).join('') || `<div class="match add">ตะกร้าว่าง<br><a href="${H()}/">กลับไปเลือกเซ็ต</a></div>`;
    $('#lines').innerHTML = cart.map((l) => `<li><span>${esc(lineName(l, map))}</span><span>x ${l.quantity}</span><span class="p">${money(linePrice(l, map) * l.quantity)} ฿</span></li>`).join('') || '<li><span class="empty">ยังไม่มีรายการ</span></li>';
    const total = cart.reduce((s, l) => s + linePrice(l, map) * l.quantity, 0);
    $('#total').textContent = money(total) + ' ฿';
    $('#store-name').innerHTML = store ? `<span class="th" style="font-size:13px;display:block">สถานที่รับของ</span>${esc(store.brand)} - ${esc(store.name)} <a class="th" style="font-size:12px;font-weight:400" href="${H()}/">เปลี่ยน</a>` : '<span class="th" style="font-weight:400;font-size:13px">ยังไม่ได้เลือกสถานที่รับของ</span>';
    updateCartBadge();
  }
  render();
  $('#confirm').addEventListener('click', () => {
    if (!getStore()) { $('#err').textContent = 'กรุณาเลือกสาขาที่รับสินค้าที่หน้าแรก / Please choose a pick-up location on the campaign page'; return; }
    submitOrder({ storeId: getStore(), note: getNote(), phone: $('#phone').value.trim(), errEl: $('#err'), btn: $('#confirm'), onFail: refreshStock });
  });
})();
</script>
</body>
</html>
