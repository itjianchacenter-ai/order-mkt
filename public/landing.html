<!doctype html>
<html lang="th">
<head>
<title>JIANCHA Order</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="icon" href="data:,">
</head>
<body>
<div class="wrap">
  <div class="landing"><a class="pill landing-btn" id="order-btn" href="/index">Order with us</a></div>
</div>
<script src="/js/app.js"></script>
<script>
(async () => {
  // The root page is a doorway: "Order with us" opens the active campaign's own page (/<slug>/)
  try {
    const menu = await api('/api/menu');
    const url = menu.campaign && menu.campaign.url ? menu.campaign.url : '/index';
    $('#order-btn').setAttribute('href', (window.PREVIEW_MODE ? '#' : '') + url);
    if (menu.campaign && menu.campaign.name) document.title = menu.campaign.name + ' | Order';
  } catch (e) { /* keep the fallback link */ }
})();
</script>
</body>
</html>
