<!doctype html>
<html lang="th">
<head>
<title>JIANCHA Membership</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<!-- หน้าแรกของแคมเปญแบบ Membership (ตั้งที่หลังบ้าน → Design → Homepage) : ฟอร์มสมัครสมาชิก ชื่อ/นามสกุล/เบอร์/เวลา/สาขา → POST /api/members -->
</head>
<body class="mb-body">
<main class="mb">
  <section class="mb-form-col">
    <h1 class="mb-title"><img src="/img/logo-jiancha.png" alt="JIANCHA"><span>Membership</span></h1>

    <form id="mb-form" novalidate>
      <div class="mb-field">
        <span class="mb-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.7 8 3.6 4.5 7.1 4.5c2 0 3.5 1.1 4.9 2.9 1.4-1.8 2.9-2.9 4.9-2.9 3.5 0 5.4 3.5 4.3 6.7-1.7 4.7-9.2 9.3-9.2 9.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><b>Member Name</b> | <span class="th-b">ชื่อสมาชิก</span></span>
        <input class="mb-input wide" name="first_name" autocomplete="given-name" placeholder="ชื่อ / First name" maxlength="80" required aria-label="ชื่อ / First name">
        <input class="mb-input wide" name="last_name" autocomplete="family-name" placeholder="นามสกุล / Last name" maxlength="80" required aria-label="นามสกุล / Last name">
      </div>

      <div class="mb-field">
        <span class="mb-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z" fill="currentColor"/></svg><b>Tel</b> | <span class="th-b">เบอร์โทรสมาชิก</span></span>
        <input class="mb-input" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="08x-xxx-xxxx" maxlength="20" required aria-label="เบอร์โทรศัพท์ / Phone" aria-describedby="mb-phone-err">
        <div class="mb-phone-err th" id="mb-phone-err" role="alert" hidden></div>
      </div>

      <div class="mb-field">
        <span class="mb-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.8 7l8.2 6 8.2-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg><b>Email</b> | <span class="th-b">อีเมล</span></span>
        <input class="mb-input" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@email.com" maxlength="160" aria-label="อีเมล / Email" aria-describedby="mb-email-note">
        <div class="mb-email-note th" id="mb-email-note" hidden>เติมจากข้อมูลสมาชิกของคุณ แก้ไขได้ / Filled from your member profile, you can edit it</div>
      </div>

      <div class="mb-field">
        <span class="mb-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 6.5V12l3.6 2.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><b>Time</b> | <span class="th-b">เวลา</span></span>
        <select class="mb-input" name="pickup_time" required aria-label="เวลา / Time"><option value="">เลือกเวลา / Choose a time</option></select>
      </div>

      <div class="mb-field">
        <span class="mb-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11.3a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="12" cy="9.7" r="2.4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8 21.2h8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><b>Location</b> | <span class="th-b">สถานที่</span></span>
        <select class="mb-input" name="store_id" required aria-label="สถานที่ / Location"><option value="">เลือกสาขา / Choose a store</option></select>
      </div>

      <label class="mb-consent th"><input type="checkbox" name="consent" required> <span>ยินยอมให้ JIANCHA เก็บและใช้ชื่อ เบอร์โทรศัพท์ และอีเมลเพื่อการเป็นสมาชิกและติดต่อกลับ / I agree to let JIANCHA store my name, phone number and email for membership.</span></label>

      <div class="err" id="mb-err" role="alert"></div>
      <button class="mb-confirm" type="submit" id="mb-submit">Confirm</button>
    </form>

    <div class="mb-done" id="mb-done" hidden>
      <span class="mb-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Welcome</b> | <span class="th-b">สมัครสมาชิกเรียบร้อย</span></span>
      <dl id="mb-summary"></dl>
      <button class="mb-confirm ghost" type="button" id="mb-again">แก้ไขข้อมูล / Edit</button>
    </div>
  </section>

  <section class="mb-art" aria-hidden="true"><img src="/img/membership-tree.webp" alt="" width="809" height="1041"></section>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = (location.pathname.split('/')[1] || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const KEY = 'jc_member:' + slug;
  async function api(path, opts = {}) {
    const init = { credentials: 'same-origin', ...opts };
    if (init.body) { init.headers = { 'Content-Type': 'application/json' }; init.body = JSON.stringify(init.body); }
    const r = await fetch(path, init); let d = null; try { d = await r.json(); } catch (e) { /* no body */ }
    if (!r.ok) { const e = new Error((d && d.error) || `HTTP ${r.status}`); e.field = d && d.field; e.notElite = Boolean(d && d.not_elite); throw e; }
    return d;
  }
  const form = $('#mb-form'), err = $('#mb-err'), btn = $('#mb-submit');
  const fill = (sel, items) => { const s = form[sel]; for (const [v, t] of items) { const o = document.createElement('option'); o.value = v; o.textContent = t; s.appendChild(o); } };

  function showDone(m) {
    $('#mb-summary').innerHTML = [['ชื่อ / Name', `${m.first_name} ${m.last_name}`], ['เบอร์ / Tel', m.phone], ['อีเมล / Email', m.email || '-'], ['เวลา / Time', m.pickup_time], ['สถานที่ / Location', m.store_name]]
      .map(([k, v]) => `<div><dt class="th">${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
    form.hidden = true; $('#mb-done').hidden = false;
  }
  $('#mb-again').addEventListener('click', () => { $('#mb-done').hidden = true; form.hidden = false; form.first_name.focus(); });

  (async () => {
    try {
      const [menu, stores] = await Promise.all([api('/api/menu?campaign=' + encodeURIComponent(slug)), api('/api/member-stores')]);
      if (menu.campaign && menu.campaign.name) document.title = `${menu.campaign.name} | JIANCHA Membership`;
      fill('pickup_time', (menu.pickup_times || []).map((t) => [t, t]));
      fill('store_id', stores.map((s) => [s.id, s.name]));
    } catch (e) { err.textContent = 'โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรช / Could not load, please refresh'; }
    try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) { for (const k of ['first_name', 'last_name', 'phone', 'email', 'pickup_time', 'store_id']) if (saved[k] && form[k]) form[k].value = saved[k]; showDone(saved); } } catch (e) { /* storage blocked */ }
  })();

  // เบอร์ต้องอยู่ในรายชื่อสมาชิก ELITE: ตรวจทันทีที่กรอกครบ แสดงข้อความสีแดงใต้ช่องเบอร์
  const phoneErr = $('#mb-phone-err');
  const LINE_OA = 'https://page.line.me/jiancha';
  const showNotElite = (msg) => {
    if (!msg) { phoneErr.hidden = true; phoneErr.textContent = ''; return; }
    phoneErr.innerHTML = esc(msg).replace('Line OA @jiancha', `<a href="${LINE_OA}" target="_blank" rel="noopener">Line OA @jiancha</a>`);
    phoneErr.hidden = false; form.phone.classList.add('invalid');
  };
  const phoneDigits = (v) => { let d = String(v || '').replace(/\D/g, ''); if (d.startsWith('66') && d.length === 11) d = '0' + d.slice(2); return d; };
  let checkSeq = 0, notElite = false;
  // อีเมล: เบอร์ที่อยู่ในรายชื่อสมาชิก → เติมอีเมลเต็มให้อัตโนมัติเป็นตัวสีเทา (แก้ได้; พอแก้ ตัวอักษรกลับเป็นสีดำ)
  let autoEmail = '';
  const emailNote = $('#mb-email-note');
  function fillEmail(email) {
    const f = form.email; const untouched = !f.value.trim() || f.value === autoEmail;
    if (!untouched) return;   // ลูกค้าพิมพ์อีเมลเองแล้ว ไม่ทับ
    autoEmail = email || ''; f.value = autoEmail; emailNote.hidden = !autoEmail; f.classList.toggle('autofilled', Boolean(autoEmail));
  }
  form.email.addEventListener('input', () => { const auto = Boolean(autoEmail) && form.email.value === autoEmail; emailNote.hidden = !auto; form.email.classList.toggle('autofilled', auto); });
  form.email.addEventListener('focus', () => { if (autoEmail && form.email.value === autoEmail) form.email.select(); });
  async function checkPhone() {
    const d = phoneDigits(form.phone.value); const seq = ++checkSeq;
    if (!/^0\d{9}$/.test(d)) { notElite = false; showNotElite(''); return true; }
    try {
      const r = await api('/api/members/check', { method: 'POST', body: { campaign: slug, phone: d } });
      if (seq !== checkSeq) return !notElite;
      notElite = !r.eligible; showNotElite(r.eligible ? '' : r.message);
      fillEmail(r.eligible ? (r.email || '') : '');
      return r.eligible;
    } catch (e) { return true; }   // ตรวจไม่ได้ (เน็ต) → ให้เซิร์ฟเวอร์ตรวจตอนกด Confirm
  }
  form.phone.addEventListener('input', () => { if (/^0\d{9}$/.test(phoneDigits(form.phone.value))) checkPhone(); else { notElite = false; showNotElite(''); } });
  form.phone.addEventListener('blur', checkPhone);
  form.addEventListener('input', (e) => { if (e.target !== form.phone || !notElite) e.target.classList.remove('invalid'); err.textContent = ''; });
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = '';
    for (const el of form.querySelectorAll('[required]')) {
      const empty = el.type === 'checkbox' ? !el.checked : !el.value.trim();
      if (empty) { el.classList.add('invalid'); el.focus(); err.textContent = el.type === 'checkbox' ? 'กรุณากดยินยอมก่อนยืนยัน / Please accept to continue' : 'กรุณากรอกข้อมูลให้ครบ / Please fill in every field'; return; }
    }
    if (!(await checkPhone())) { form.phone.focus(); return; }
    btn.disabled = true; btn.textContent = '…';
    const body = { campaign: slug, first_name: form.first_name.value, last_name: form.last_name.value, phone: form.phone.value, email: form.email.value.trim(), pickup_time: form.pickup_time.value, store_id: form.store_id.value };
    try {
      api('/api/pdpa', { method: 'POST' }).catch(() => {});
      const r = await api('/api/members', { method: 'POST', body });
      try { localStorage.setItem(KEY, JSON.stringify(r.member)); } catch (x) { /* storage blocked */ }
      showDone(r.member);
    } catch (ex) {
      if (ex.notElite) { notElite = true; showNotElite(ex.message); form.phone.focus(); }
      else { err.textContent = ex.message; if (ex.field && form[ex.field]) { form[ex.field].classList.add('invalid'); form[ex.field].focus(); } }
    } finally { btn.disabled = false; btn.textContent = 'Confirm'; }
  });
})();
</script>
</body>
</html>
