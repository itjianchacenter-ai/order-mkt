# Publishes the backend-free PREVIEW build to GitHub Pages
# (https://itjianchacenter-ai.github.io/order-mkt/ → order.jianchatea.com).
# The real ordering system runs server.js on a server; see README.md.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ตั้ง Repository variable GOOGLE_CLIENT_ID (Settings → Secrets and variables → Actions → Variables) เพื่อเปิด Sign in with Google บน preview
      # สคริปต์เดียวกับที่ใช้บน Cloudflare Pages (scripts/build-site.sh)
      - run: bash scripts/build-site.sh
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
